# Mosquitto MQTT Broker Configuration for TRAFFICORE
# Save this as: /etc/mosquitto/conf.d/mosquitto.conf

# Standard MQTT port
listener 1883
protocol mqtt

# WebSocket port (for browser clients)
listener 9001
protocol websockets

# Allow anonymous connections (for development)
# For production, set to false and configure authentication
allow_anonymous true

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type all

# Connection settings
max_connections -1
max_queued_messages 1000

# Keep alive
keepalive_interval 60
