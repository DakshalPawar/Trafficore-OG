# ============================================
# MQTT CONFIGURATION
# ============================================
mqtt.broker.url=tcp://192.168.0.232:1883
mqtt.client.id=spring-hospital-backend
mqtt.client.username=
mqtt.client.password=
mqtt.connection.timeout=10

# MQTT Topics
mqtt.topic.patient=hospital/patient
mqtt.topic.gps=hospital/gps
mqtt.topic.chat.doctor=hospital/chat/doctor
mqtt.topic.chat.ambulance=hospital/chat/ambulance

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.trafficore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# JACKSON JSON
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC