# ============================================
# TRAFFICORE Hospital Dashboard Backend Config
# ============================================

spring.application.name=trafficore-hospital-backend
server.port=8080

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Currently using H2 (in-memory) for testing with FAKE DATA
# Switch to MySQL when ready for production

# H2 Database Configuration (Current - for testing)
spring.datasource.url=jdbc:h2:mem:trafficoredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional - access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# MySQL Configuration (Uncomment when ready)
# ============================================
# spring.datasource.url=jdbc:mysql://localhost:3306/trafficore_db
