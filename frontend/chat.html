<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAFFICORE - Doctor Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 80vh;
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 6px;
    }
    .doctor { background: #dfe6e9; text-align: right; }
    .ambulance { background: #ffeaa7; text-align: left; }
    .chat-input {
      display: flex;
    }
    .chat-input input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 5px;
    }
    .chat-input button {
      padding: 8px 12px;
      border: none;
      background: #2c3e50;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <h2>🚦 TRAFFICORE</h2>
  <ul>
    <li><a href="index.html">🏠 Dashboard</a></li>
    <li><a href="camera.html">📹 Live Camera</a></li>
    <li><a href="stats.html">📊 Patient Stats</a></li>
    <li><a href="gps.html">📍 GPS Tracking</a></li>
    <li><a href="alerts.html">⚠️ Alerts</a></li>
    <li><a href="chat.html">💬 Doctor Chat</a></li>
    <li><a href="reports.html">📑 Reports</a></li>
  </ul>
</div>

<div class="main-content">
  <header>
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    Doctor Communication
  </header>

  <main>
    <div class="chat-container">
      <div id="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>
</div>

</body>
</html>
