<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAFFICORE - Doctor Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    .chat-container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    #chat-box {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .chat-message {
      margin-bottom: 15px;
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 70%;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message.doctor {
      background: #667eea;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .chat-message.ambulance {
      background: white;
      color: #333;
      margin-right: auto;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 0.85em;
      opacity: 0.8;
    }

    .message-body {
      font-size: 1em;
    }

    .timestamp {
      font-size: 0.85em;
    }

    .chat-input-container {
      display: flex;
      padding: 20px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #chat-input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s;
    }

    #chat-input:focus {
      border-color: #667eea;
    }

    #send-btn {
      margin-left: 10px;
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1em;
      transition: transform 0.2s;
    }

    #send-btn:hover {
      transform: scale(1.05);
    }

    #send-btn:active {
      transform: scale(0.95);
    }

    .connection-status {
      padding: 10px;
      text-align: center;
      font-size: 0.9em;
    }

    .connection-status.connected {
      background: #4ade80;
      color: white;
    }

    .connection-status.disconnected {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>🚦 TRAFFICORE</h2>
  <ul>
    <li><a href="index.html">🏠 Dashboard</a></li>
    <li><a href="camera.html">📹 Live Camera</a></li>
    <li><a href="stats.html">📊 Patient Stats</a></li>
    <li><a href="gps.html">📍 GPS Tracking</a></li>
    <li><a href="alerts.html">⚠️ Alerts</a></li>
    <li><a href="chat.html" class="active">💬 Doctor Chat</a></li>
    <li><a href="reports.html">📑 Reports</a></li>
  </ul>
</div>

<!-- Main -->
<div class="main-content">
  <header>
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    Doctor - Ambulance Communication
  </header>

  <div class="connection-status" id="connection-status">
    Connecting to server...
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <h2>💬 Live Chat with Ambulance</h2>
      <p>Real-time communication for emergency coordination</p>
    </div>

    <div id="chat-box">
      <!-- Messages will appear here -->
    </div>

    <div class="chat-input-container">
      <input
              type="text"
              id="chat-input"
              placeholder="Type your message here..."
              autocomplete="off"
      >
      <button id="send-btn" onclick="sendChatMessage()">Send 📤</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
