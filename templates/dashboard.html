<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP8266 IoT Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #3a1c71, #d76d77, #ffaf7b);
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 30px;
      margin: 40px auto;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .value {
      font-size: 3rem;
      margin: 10px 0;
    }
    .label {
      font-size: 1.2rem;
      color: #eee;
    }
  </style>
</head>
<body>
  <header>
    <h1>ESP8266 Smart Monitor</h1>
  </header>

  <div class="card">
    <div class="value" id="temperature">-- °C</div>
    <div class="label">Temperature</div>
  </div>

  <div class="card">
    <div class="value" id="relay_status">--</div>
    <div class="label">Relay Status</div>
  </div>

  <script>
    function updateSensorData() {
      fetch('/get-data')
        .then(response => response.json())
        .then(data => {
          document.getElementById('temperature').textContent = data.temperature + " °C";
          document.getElementById('relay_status').textContent = data.relay == 1 ? "ON" : "OFF";
        })
        .catch(error => {
          console.error('Error fetching data:', error);
        });
    }

    // Refresh every 5 seconds
    setInterval(updateSensorData, 5000);
    updateSensorData();
  </script>
</body>
</html>
